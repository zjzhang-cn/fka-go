<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fka 网页客户端</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <strong>fka</strong>
    <span id="status" class="status offline">未连接</span>
    <div class="controls">
      <input id="conversation" type="text" autocomplete="off" spellcheck="false" title="会话 id，可自定义；不同 id 是不同对话">
      <input id="token" type="password" autocomplete="off" placeholder="访问令牌" title="服务器 WEB_CHANNEL_TOKEN">
      <button id="connect" type="button">连接</button>
    </div>
  </header>

  <main id="log" aria-live="polite"></main>

  <form id="composer">
    <label id="attach" class="icon" title="发送文件" aria-label="发送文件">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      <input id="file" type="file" multiple hidden>
    </label>
    <textarea id="text" rows="2" placeholder="说点什么…（Enter 发送，Shift+Enter 换行；# 引用会话文件）"></textarea>
    <button id="send" type="button" class="icon" title="发送" aria-label="发送">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/></svg>
    </button>
  </form>

  <div id="picker" class="picker" hidden></div>
  <div id="dropzone" class="dropzone" hidden><span>松开鼠标，把文件发给它</span></div>

  <script src="/app.js"></script>
</body>
</html>
