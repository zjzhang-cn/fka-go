# fka-sandbox 沙盒容器编排：一条命令起一个「已经装好 python3 / nodejs 的隔离沙盒」。
#
#   make docker-sandbox                                    # 先交叉编译并构建镜像
#   docker compose -f mcp/mcp_sandbox/docker-compose.yml up -d
#
# 镜像里不编译 fka-sandbox，build 段要求 bin/fka-sandbox-linux-<arch> 已存在（见 Dockerfile）。
# 所以别直接 `up --build` 而不先跑 `make docker-sandbox`。
#
# ## 边界在哪
#
# 宿主部署时用 bwrap 起命名空间沙盒；这里**容器就是沙盒**，容器里走 direct 模式。
# 所以下线不能松：read_only 根文件系统 + 只给 /sandbox 可写 + cap_drop ALL +
# no-new-privileges，把「模型 `cd /` 然后乱写」也一并关在容器只读根里。
#
# ## 网络
#
# MCP 用 HTTP 传输，agent 必须能连到 8080——所以容器**默认是通网的**（与 bwrap
# 「默认独立网络」不同）。若本部署允许模型联网装包，设 SANDBOX_ALLOW_PIP=1 让工具说明
# 与事实一致；若要断掉外网，改用 `network_mode: none` 并让 agent 经别的方式连（或
# 仅保留一个只连 agent 的内部网络）。
services:
  sandbox:
    build:
      context: ../..
      dockerfile: mcp/mcp_sandbox/Dockerfile
    image: fka-sandbox:latest
    ports:
      # 只发布到宿主回环：这是个能执行命令的 server，别默认暴露给同网段。
      # 宿主端口可用 SANDBOX_MCP_PORT 覆盖（默认 8080）；被别的进程占用时换一个，
      # setup.sh 会把这个端口写进 mcp.json 的 url，两边保持一致。
      - "127.0.0.1:${SANDBOX_MCP_PORT:-8080}:8080"
    volumes:
      # 沙盒数据与审计日志用**命名卷**，不用宿主目录。宿主 bind 有两个坑：
      #   1. Docker 以 root 建缺失的宿主目录，而容器以非 root 的 fka 运行，写不进
      #      （症状：容器起来即退出，`mkdir /sandbox/tmp: permission denied`）；
      #   2. 若落到仓库里，这些 root/10001 属主的目录会污染构建上下文，非 root
      #      stat 不了，下次 `docker build` 直接失败。
      # 命名卷首次由镜像内容初始化，属主就是镜像里 chown 过的 fka。
      - sandbox:/sandbox
      - logs:/logs
    # 容器即边界：根只读，只留沙盒与日志两处可写，/tmp 走内存。
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  sandbox:
  logs:
